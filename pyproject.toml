[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elda-spt"
version = "3.0.0"
description = "ELDA fork of Superpoint Transformer, CPU neighbour search and device-agnostic inference"
requires-python = ">=3.10"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.isort]
multi_line_output = 4
include_trailing_comma = true
skip = [".gitignore", "__init__.py"]
